<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Zé - Cadastro</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

    <link rel="stylesheet" href="style-cadastro.css">
</head>

<body>

    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="login-wrap p-0">
                        <h3 class="mb-4 text-center">Cadastre-se</h3>
                        <form id="form-cadastro" action="#" class="signin-form">
                            <div class="form-group">
                                <input type="email" class="form-control" id="usuario" placeholder="E-mail" required>
                            </div>
                            <div class="form-group">
                                <input type="password" id="senha" class="form-control" placeholder="Senha" required>
                            </div>
                            <div class="form-group">
                                <input type="text" id="nome" class="form-control" placeholder="Nome" required>
                            </div>
                            <div class="form-group">
                                <input type="text" id="sobrenome" class="form-control" placeholder="Sobrenome" required>
                            </div>
                            <div class="form-group">
                                <input type="text" id="cidade" class="form-control" placeholder="Cidade" required>
                            </div>
                            <select id="estado" class="form-select" aria-label="Default select example">
                                <option selected>Estado</option>
                                <option value="1">AC</option>
                                <option value="2">AL</option>
                                <option value="3">AP</option>
                                <option value="4">AM</option>
                                <option value="5">BA</option>
                                <option value="6">CE</option>
                                <option value="7">DF</option>
                                <option value="8">ES</option>
                                <option value="9">GO</option>
                                <option value="10">MA</option>
                                <option value="11">MT</option>
                                <option value="12">MS</option>
                                <option value="13">MG</option>
                                <option value="14">PA</option>
                                <option value="15">PB</option>
                                <option value="16">PR</option>
                                <option value="17">PE</option>
                                <option value="18">PI</option>
                                <option value="19">RJ</option>
                                <option value="20">RN</option>
                                <option value="21">RS</option>
                                <option value="22">RO</option>
                                <option value="23">RR</option>
                                <option value="24">SC</option>
                                <option value="25">SP</option>
                                <option value="26">SE</option>
                                <option value="27">TO</option>
                            </select>
                            <select id="permissao" class="form-select" aria-label="Default select example">
                                <option selected>Permissão</option>
                                <option value="1">Administrador</option>
                                <option value="2">Vendedor</option>
                            </select>
                            <div class="form-group">
                                <button type="button" id="btn-cadastro"
                                    class="form-control btn btn-cadastro submit px-3">Cadastrar</button>
                            </div>
                        </form>
                        <p class="w-100 text-center">&mdash; Já tem conta? &mdash;</p>
                        <div class="social d-flex text-center">
                            <a href="login.html" class="login-form"><span
                                    class="login-form"></span>
                                Faça login!</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="app-cadastro.js"></script>

</body>

</html>
